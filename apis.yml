aid: nebex
name: Nebex
description: >-
  Nebex operates Nebra Exchange, an exchange platform for the global space
  economy that connects commercial space suppliers, sovereign buyers such as
  governments and space agencies, and financial institutions. The platform aims
  to standardize space-commerce infrastructure so demand can find supply faster,
  workflows can be coordinated across multilateral participants, and capital can
  participate through transparent structures, facilitating complex transactions
  from demand to delivery including sourcing, coordination, and settlement.
  Founded by Tejpaul Bhatia (CEO) and Anand Subramanian (COO), both formerly of
  Axiom Space, Nebex is backed by GV. The company currently offers early,
  invite-based access to the Nebra Exchange platform and does not yet publish a
  public API, developer portal, or SDK program.
